<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股策略分析</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='3' height='24' fill='%23ef5350'/><rect x='10' y='10' width='3' height='18' fill='%234caf50'/><rect x='16' y='7' width='3' height='21' fill='%234caf50'/><rect x='22' y='13' width='3' height='15' fill='%23ef5350'/><rect x='28' y='16' width='3' height='12' fill='%234caf50'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f5f5;color:#333;padding:20px;max-width:920px;margin:0 auto}
h1{font-size:20px;margin-bottom:12px}
form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-width:520px}
input{width:100%;padding:10px 14px;font-size:16px;border:2px solid #ddd;border-radius:6px;outline:none}
input:focus{border-color:#1565C0}
button{padding:10px 24px;font-size:16px;background:#1565C0;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:hover{background:#0D47A1}
button:disabled{background:#90CAF9;cursor:wait}
label.holding{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;padding:4px 0}
label.holding input{width:auto}
.result{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.result h2{font-size:18px;margin-bottom:12px}
.result img{max-width:100%;margin-top:16px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.error{background:#fff0f0;color:#c62828;padding:16px;border-radius:6px;border:1px solid #ffcdd2}
.loading{text-align:center;padding:40px;color:#666}
.conclusion{padding:14px 20px;margin:10px 0;border-radius:6px;font-size:20px;font-weight:bold;text-align:center;letter-spacing:4px}
.buy{background:#e8f5e9;color:#2e7d32;border:2px solid #4caf50}
.sell{background:#fce4ec;color:#c62828;border:2px solid #ef5350}
.warn{background:#fff8e1;color:#f57f17;border:2px solid #ffc107}
table{border-collapse:collapse;width:100%;margin:0;font-size:13px}
table.overview td{padding:8px 12px;border-bottom:1px solid #eee}
table.overview td:first-child{font-weight:bold;color:#666;width:120px}
table.overview th{background:#1565C0;color:#fff;padding:10px;text-align:center;font-size:15px;border-radius:6px 6px 0 0}
table.trades th{background:#f5f5f5;padding:8px 10px;text-align:left;border-bottom:2px solid #ddd}
table.trades td{padding:8px 10px;border-bottom:1px solid #f0f0f0}
table.trades tr.win{background:#f1f8e9}
table.trades tr.loss{background:#fff3f0}
td.pnl{font-weight:bold}
tr.win td.pnl{color:#2e7d32}
tr.loss td.pnl{color:#c62828}
td.reason{color:#888;font-size:12px}
h3{margin:16px 0 8px;font-size:16px}

/* ── 公式卡片 ── */
.strategy{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-top:8px}
.strategy h3{font-size:14px;margin-bottom:12px;color:#1565C0}
.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.formula-item{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:4px 0}
.formula-label{font-weight:600;white-space:nowrap;color:#555;min-width:72px}
.formula-w{color:#1565C0;font-weight:700;min-width:32px;text-align:right;font-size:12px}
.formula-math{color:#333;font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.5}
.formula-section{margin-top:10px;padding-top:8px;border-top:1px solid #eee}
.formula-section h4{font-size:12px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.gate-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#666}
.gate-tag{background:#f5f5f5;padding:2px 8px;border-radius:3px;font-family:'SF Mono',Consolas,monospace}
.gate-tag.fail{background:#fce4ec;color:#c62828}

/* ── Tab ── */
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #ddd}
.tab{padding:10px 20px;font-size:15px;background:transparent;color:#666;border:none;border-bottom:3px solid transparent;border-radius:0;cursor:pointer}
.tab.active{color:#1565C0;font-weight:bold;border-bottom-color:#1565C0;background:transparent}
.tab:hover{color:#1565C0;background:transparent}

/* ── 海选表格 ── */
.scan-table{border-collapse:collapse;width:100%;margin-top:12px;font-size:14px}
.scan-table th,.scan-table td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
.scan-table th{background:#f5f5f5}
.scan-meta{color:#888;font-size:12px;margin-top:8px}
.scan-form{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.scan-form input{width:64px;padding:6px 10px;font-size:14px;border:2px solid #ddd;border-radius:6px}
.scan-form button{padding:8px 16px;font-size:14px}
.hint{color:#888;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<h1>📊 A股策略分析</h1>
<div class="tabs">
  <button class="tab active" onclick="switchTab('analyze')">策略分析</button>
  <button class="tab" onclick="switchTab('scan')">Top-N 海选</button>
</div>

<!-- ══════════ Tab 1: 策略分析 ══════════ -->
<div id="tab-analyze">
<form onsubmit="analyze(event)">
  <input id="code" type="text" placeholder="输入股票代码，如 603893" autofocus required>
  <div style="margin:8px 0">
    <select id="strategy" onchange="onStrategyChange()" style="padding:8px 12px;font-size:16px;border:2px solid #ddd;border-radius:6px;background:#fff">
      <option value="comprehensive">融合策略</option>
      <option value="buyhold">长线持有</option>
      <option value="value">巴芒基本面研究</option>
    </select>
  </div>
  <label class="holding">
    <input type="checkbox" id="holding" onchange="toggleDividend()"> 已持仓
  </label>
  <label class="holding" id="divLabel" style="display:none">
    <input type="checkbox" id="calcDividend"> 计算分红（含每股分红收益）
  </label>
  <div class="strategy" id="formulaBox"></div>
  <button id="btn" type="submit">分析</button>
</form>
<div id="result"></div>
</div>

<!-- ══════════ Tab 2: Top-N 海选 ══════════ -->
<div id="tab-scan" style="display:none">
  <div class="strategy">
    <h3>📐 Top-N 海选算法</h3>
    <p class="hint">
      全市场主板（600/601/603/605/000/001/002/003）每只股票算 <b>12 个技术因子</b>：
      低波动率、低 ATR、低成交额（小市值效应）、均值回归（接近 MA20）、超买超卖健康度、
      动量、均线多头度、量比、OBV 净量能流、量价配合等。<br>
      每个因子在<b>横截面做百分位排名</b>，用回测训练出的 <b>ICIR 权重</b>加权合成总分，
      再<b>过滤亏损股（PE≤0）、高 PE（&gt;100）、低价股（&lt;5 元）</b>，按总分降序取 top-N。
      约 30~60 秒。
    </p>
  </div>
  <div class="scan-form">
    <label>Top N <input id="scanN" value="5" type="number" min="1" max="100"></label>
    <label>PE上限 <input id="scanPe" value="100" type="number" step="10"></label>
    <label>最低价 <input id="scanPrice" value="5" type="number" step="0.5"></label>
    <button onclick="runScan()">开始海选</button>
  </div>
  <div id="scan-result"></div>
</div>

<script>
const FORMULAS={
  comprehensive:{title:'融合策略（双路径）',html:`
    <div class="formula-section"><h4>核心评分 S*</h4>
      <div class="formula-math" style="font-size:14px;text-align:center;padding:4px 0"><b>S*</b> = M<sub>MACD</sub>×0.40 + F<sub>因子</sub>×0.30 + P<sub>价格位置</sub>×0.15 + Q<sub>量能</sub>×0.15 − 0.08×A<sub>18副指标共识</sub> + Z<sub>资金流</sub></div>
    </div>
    <div class="formula-grid">
      <div class="formula-item"><span class="formula-label">MACD核心</span><span class="formula-w">40%</span><span class="formula-math">DIF/DEA多空、零轴、5日DIF斜率、3日BAR趋势、底/顶背离</span></div>
      <div class="formula-item"><span class="formula-label">多因子</span><span class="formula-w">30%</span><span class="formula-math">RSI、KDJ、J值、布林位置、WR超买超卖</span></div>
      <div class="formula-item"><span class="formula-label">价格位置/趋势</span><span class="formula-w">15%</span><span class="formula-math">250日价格位置、年价格涨幅</span></div>
      <div class="formula-item"><span class="formula-label">量能</span><span class="formula-w">15%</span><span class="formula-math">OBV 5日净量能流、量价背离、机构吸筹代理</span></div>
    </div>
    <div class="formula-section"><h4>18 项辅助指标共识 A（−8 ~ +8 反向修正）</h4>
      <div class="formula-math" style="font-size:12px">DMI、CCI、BIAS(6/12)、EXPMA、BBI、TRIX、VR、BR、AR、CR、DMA、DPO、MTM、SKDJ、LWR、ENE、LON —— 各投 +1看多/−1看空/0中性，A=(N多−N空)/18×100</div>
    </div>
    <div class="formula-section"><h4>资金流加分 Z</h4>
      <div class="formula-math" style="font-size:12px">主力净流入当日横截面百分位 rank × 10（0~10 分）</div>
    </div>
    <div class="formula-section"><h4>🟢 双路径买入</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px">
        <div><b style="color:#1565C0">路径1 技术达标</b><br>S*≥69 → 首仓25%<br>分数增强加仓：≥75→50%、≥80→75%、≥85→100%</div>
        <div><b style="color:#e65100">路径2 龙虎榜龙头</b><br>连板≥2+净买&gt;15%+换手&lt;12.5%<br>→ 满仓100万，持有2日卖出</div>
      </div>
    </div>
    <div class="formula-section"><h4>🔴 减仓 / 清仓</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px">
        <div style="color:#f57f17"><b>减仓</b> &nbsp; S*&lt;35 或 炸板 → 减至50%</div>
        <div style="color:#c62828"><b>清仓</b> &nbsp; 移动止盈(回撤8%) | 止损−8% | 跌破5日线</div>
      </div>
    </div>
    <div class="formula-section"><h4>质量门禁（任一项触发即否决买入）</h4>
      <div class="gate-row">
        <span class="gate-tag">OBV 5日净量能流 &lt; −60%</span>
        <span class="gate-tag">RSI &gt; 92</span>
        <span class="gate-tag">M&lt;35 ∧ F&lt;40</span>
      </div>
    </div>`
  },
  buyhold:{title:'长线持有',html:`
    <div style="font-size:13px;line-height:1.8;color:#555">
      <b>买入</b>：数据起始日一次性买入，持有至今不卖<br>
      <b>分红</b>：持有期间所有已实施分红累加<br>
      <b>对比</b>：直观比较 <i>"择时交易 vs 买入不动"</i> 的收益差异
    </div>`
  },
  value:{title:'巴芒基本面研究',html:`
    <div style="font-size:13px;line-height:1.8;color:#555">
      <b>财务质量初筛</b>：连续扣非盈利、经营现金流转化、ROE、杠杆与流动性<br>
      <b>数据口径</b>：已披露年报摘要；未替代年报原文、治理审查或行业研究<br>
      <b>输出边界</b>：只给候选池研究状态，不生成买卖信号或 DCF 目标价
    </div>`
  }
};
function switchTab(name){
  document.getElementById('tab-analyze').style.display = name==='analyze'?'block':'none';
  document.getElementById('tab-scan').style.display = name==='scan'?'block':'none';
  const tabs=document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active',name==='analyze');
  tabs[1].classList.toggle('active',name==='scan');
}
function getStrategy(){return document.getElementById('strategy').value;}
function onStrategyChange(){
  const s=getStrategy();
  const holding=document.getElementById('holding');
  const f=FORMULAS[s];
  const box=document.getElementById('formulaBox');
  box.innerHTML='<h3>📐 策略公式 — '+f.title+'</h3>'+f.html;
  if(s==='buyhold'){
    holding.checked=true;holding.disabled=true;
    document.getElementById('divLabel').style.display='flex';
  }else if(s==='value'){
    holding.checked=false;holding.disabled=true;
    document.getElementById('calcDividend').checked=false;
    document.getElementById('divLabel').style.display='none';
  }else{holding.disabled=false;toggleDividend();}
}
function toggleDividend(){
  const holding=document.getElementById('holding').checked;
  document.getElementById('divLabel').style.display=holding?'flex':'none';
  if(!holding)document.getElementById('calcDividend').checked=false;
}
async function runScan(){
  const n=document.getElementById('scanN').value;
  const pe=document.getElementById('scanPe').value;
  const price=document.getElementById('scanPrice').value;
  const box=document.getElementById('scan-result');
  box.innerHTML='<div class=loading>⏳ 海选中，约 30~60 秒...</div>';
  try{
    const url='/scan?n='+encodeURIComponent(n)+'&max_pe='+encodeURIComponent(pe)+'&min_price='+encodeURIComponent(price);
    const resp=await fetch(url);
    if(!resp.ok){const t=await resp.text();box.innerHTML='<div class=error>'+t+'</div>'}
    else{box.innerHTML=await resp.text()}
  }catch(err){box.innerHTML='<div class=error>请求失败: '+err.message+'</div>'}
}
async function analyze(e){
  e.preventDefault();
  const code=document.getElementById('code').value.trim();
  const holding=document.getElementById('holding').checked;
  const calcDividend=document.getElementById('calcDividend').checked;
  const strategy=getStrategy();
  if(!code)return;
  if(strategy==='buyhold' && !holding){
    alert('长线持有策略需要先勾选"已持仓"');
    return;
  }
  const btn=document.getElementById('btn');
  const result=document.getElementById('result');
  btn.disabled=true;btn.textContent='分析中...';
  result.innerHTML='<div class=loading>⏳ 正在拉取数据并计算...</div>';
  try{
    const url='/analyze?code='+encodeURIComponent(code)+'&holding='+(holding?'1':'0')+'&dividend='+(calcDividend?'1':'0')+'&strategy='+strategy;
    const resp=await fetch(url);
    if(!resp.ok){const t=await resp.text();result.innerHTML='<div class=error>'+t+'</div>'}
    else{result.innerHTML=await resp.text()}
  }catch(err){result.innerHTML='<div class=error>请求失败: '+err.message+'</div>'}
  btn.disabled=false;btn.textContent='分析'
}
onStrategyChange();
</script>
</body>
</html>
